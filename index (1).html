<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teams</title>
<style>
:root {
  --bg: #f0f0f0; --panel: #ffffff; --rail: #292a3e; --rail-on: #3d3f5c;
  --text: #242424; --mute: #6b6b6b; --line: #e3e3e3; --brand: #5b5fc7;
  --them: #f0f0f0; --me: #5b5fc7; --me-text: #ffffff; --hover: #f5f5f8;
  --chip: #ffffff; --chip-line: #5b5fc7; --toast: #ffffff; --danger: #c4314b;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1f; --panel: #242428; --rail: #17171c; --rail-on: #2e2e36;
    --text: #f2f2f2; --mute: #a3a3ad; --line: #37373f; --brand: #8b8fe0;
    --them: #34343c; --me: #5b5fc7; --me-text: #ffffff; --hover: #2c2c33;
    --chip: #242428; --chip-line: #8b8fe0; --toast: #2c2c33; --danger: #ff7a8a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1f; --panel: #242428; --rail: #17171c; --rail-on: #2e2e36;
  --text: #f2f2f2; --mute: #a3a3ad; --line: #37373f; --brand: #8b8fe0;
  --them: #34343c; --me: #5b5fc7; --me-text: #ffffff; --hover: #2c2c33;
  --chip: #242428; --chip-line: #8b8fe0; --toast: #2c2c33; --danger: #ff7a8a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:active { transform: scale(0.97); }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 68px 1fr; height: 100vh; height: 100dvh; }

/* Rail */
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
.rb {
  width: 56px; padding: 8px 0 6px; border-radius: 8px; color: #c9c9d6;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 20px; position: relative;
}
.rb span { font-size: 11px; }
.rb.on { background: var(--rail-on); color: #fff; }
.rb .dot { position: absolute; top: 4px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }

/* Panels */
.panel { min-height: 0; display: grid; grid-template-columns: 300px 1fr; background: var(--panel); }
#p-outlook, #p-teams, #p-calls, #p-calendar { grid-template-columns: 1fr; }
#p-outlook { display: flex; flex-direction: column; }
#p-teams, #p-calls, #p-calendar { overflow-y: auto; align-content: start; }

.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.lh { padding: 16px 18px 10px; }
.lh h2 { margin: 0; font-size: 20px; font-weight: 700; }
.search { margin: 0 14px 10px; padding: 8px 12px; border-radius: 6px; background: var(--bg); color: var(--mute); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; width: 100%; text-align: left; }
.item:hover { background: var(--hover); }
.item .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item small, .ch small { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item b { font-weight: 600; }
.unread-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex: none; }
.av {
  width: 40px; height: 40px; border-radius: 50%; background: #c6a2f0; color: #2b1140;
  display: grid; place-items: center; font-weight: 600; flex: none; font-size: 14px;
}
.av.sm { width: 32px; height: 32px; font-size: 13px; }

.convo { display: flex; flex-direction: column; min-height: 0; }
.ch { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.ch > div { display: flex; flex-direction: column; min-width: 0; }
.back { display: none; font-size: 26px; padding: 0 6px 0 0; line-height: 1; }
#status { color: var(--mute); }

.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; }
.tbox { display: flex; flex-direction: column; gap: 6px; min-height: 100%; justify-content: flex-end; }
.msg {
  max-width: 72%; padding: 8px 12px; border-radius: 12px; white-space: pre-line; word-wrap: break-word;
  animation: pop 180ms ease-out;
}
.sender { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--mute); margin: 4px 0 -2px 12px; }
.msg.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 3px; }
.msg.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 3px; }
.msg.sys {
  align-self: center; max-width: 100%; color: var(--mute); font-size: 12px; letter-spacing: .08em;
  font-weight: 600; background: none; padding: 8px 0; text-align: center;
}
.typing { align-self: flex-start; color: var(--mute); padding: 6px 12px; font-size: 13px; }
.typing i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--mute); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.composer { border-top: 1px solid var(--line); padding: 10px 14px calc(12px + var(--safe-b)); }
.chips { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.chips:empty { display: none; }
.chips .label { color: var(--mute); font-size: 12px; }
.chip {
  text-align: left; padding: 11px 14px; border: 1px solid var(--chip-line); border-radius: 10px;
  background: var(--chip); color: var(--text); font-size: 15px;
}
.chip:hover { background: var(--hover); }
.restart { align-self: center; padding: 9px 18px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 600; }
.bar { border: 1px solid var(--line); border-radius: 20px; padding: 10px 16px; color: var(--mute); background: var(--bg); }

.empty { padding: 30px 18px; color: var(--mute); }
.placeholder { display: none; flex: 1; align-items: center; justify-content: center; color: var(--mute); }
#p-chat.no-chat .placeholder { display: flex; }
#p-chat.no-chat .ch, #p-chat.no-chat .msgs, #p-chat.no-chat .composer { display: none; }

/* Teams */
.team { padding: 14px 18px 4px; font-weight: 700; }
.chan { display: flex; flex-direction: column; width: 100%; text-align: left; padding: 9px 18px 9px 34px; }
.chan:hover { background: var(--hover); }
.chan small { color: var(--mute); }

/* Calls */
.call { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.call .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.call small { color: var(--mute); }
.call .missed { color: var(--danger); }
.call .when { color: var(--mute); font-size: 12px; white-space: nowrap; }

/* Toasts */
#toasts { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 10; width: 320px; max-width: calc(100vw - 28px); }
.toast {
  text-align: left; background: var(--toast); border: 1px solid var(--line); border-left: 4px solid var(--brand);
  border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
  display: flex; flex-direction: column; gap: 2px; animation: slide 220ms ease-out; transition: opacity .4s;
}
.toast b { font-weight: 600; }
.toast span { color: var(--mute); white-space: pre-line; overflow: hidden; text-overflow: ellipsis; }
.toast.out { opacity: 0; }
@keyframes slide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ===== Outlook: same app as the portal's email client ===== */
.ol { background: #ffffff; color: #242424; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 48px -28px rgba(0,0,0,.8); font-family: var(--sans); }
.ol-top { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #0f6cbd; color: #fff; }
.ol-logo { font: 600 14px var(--sans); white-space: nowrap; }
.ol-search { flex: 1; min-width: 0; background: rgba(255,255,255,.2); border-radius: 6px; padding: 6px 10px; font-size: 13px; color: #e3eefa; }
.ol-av { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #0f6cbd; display: grid; place-items: center; font: 600 11px var(--sans); flex: none; }
.ol-folders { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #e1e1e1; overflow-x: auto; }
.ol-folder { font: 500 12px var(--sans); padding: 5px 10px; border-radius: 6px; border: 0; background: none; color: #616161; white-space: nowrap; }
.ol-folder:hover { background: #f3f3f3; }
.ol-folder[aria-pressed="true"] { background: #e6f0fa; color: #0f6cbd; font-weight: 600; }
.ol-folder .ct { color: #0f6cbd; font-weight: 700; margin-left: 4px; }
.ol-list { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid #e1e1e1; }
.ol-item { display: grid; grid-template-columns: 38px minmax(0, 1fr); min-width: 0; gap: 10px; width: 100%; text-align: left; background: #fff; border: 0; border-bottom: 1px solid #f0f0f0; padding: 12px 14px; color: inherit; }
.ol-item:hover { background: #f5f9fd; }
.ol-item[aria-selected="true"] { background: #eef5fc; box-shadow: inset 3px 0 0 #0f6cbd; }
.ol-item .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 13px var(--sans); }
.ol-item > div { min-width: 0; }
.ol-item .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.ol-item .from { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-item .date { font-size: 11px; color: #616161; white-space: nowrap; }
.ol-item .subj { font-size: 13px; margin-top: 2px; }
.ol-item .prev { font-size: 12px; color: #616161; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ol-item.unread .from, .ol-item.unread .subj { font-weight: 700; }
.ol-item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #0f6cbd; margin-right: 6px; vertical-align: middle; }
.ol-item .draft-tag { color: #a4262c; font-weight: 600; }
.ol-empty { padding: 28px 14px; font-size: 13px; color: #616161; text-align: center; margin: 0; }
.ol-read { padding: 18px 18px 22px; min-width: 0; }
.ol-read .subject { font: 600 19px/1.25 var(--sans); margin: 0 0 14px; overflow-wrap: anywhere; }
.hdr { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
.hdr .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 13px var(--sans); flex: none; }
.hdr .who { font-weight: 600; font-size: 14px; }
.hdr .meta { font-size: 12px; color: #616161; line-height: 1.6; overflow-wrap: anywhere; }
.ol-read p { font: 400 14px/1.6 var(--sans); margin: 0 0 12px; overflow-wrap: anywhere; }
.ol-att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e1e1e1; }
.ol-att span { font: 500 12px var(--sans); padding: 7px 10px; border: 1px solid #d1d1d1; border-radius: 6px; background: #fafafa; color: #242424; max-width: 100%; overflow-wrap: anywhere; }
.ol-att span::before { content: "\1F4CE"; margin-right: 6px; }
details.earlier { margin-top: 18px; }
details.earlier summary { cursor: pointer; color: #0f6cbd; font: 600 13px var(--sans); padding: 8px 0; }
details.earlier .quoted { border-left: 3px solid #c7d9ee; padding-left: 14px; margin-top: 8px; }
.ol-main { display: block; }
.ol-back { display: inline-flex; background: none; border: 0; padding: 4px 0 14px; color: #0f6cbd; font: 600 14px var(--sans); }
.ol.reading .ol-folders, .ol.reading .ol-list { display: none; }
.ol:not(.reading) .ol-read { display: none; }
.hdr .who { overflow-wrap: anywhere; }
@media (min-width: 720px) {
  .ol-main { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); }
  .ol .ol-list { border-bottom: 0; border-right: 1px solid #e1e1e1; max-height: 560px; overflow-y: auto; }
  .ol .ol-folders, .ol.reading .ol-folders { display: flex; }
  .ol .ol-list, .ol.reading .ol-list { display: block; }
  .ol .ol-read, .ol:not(.reading) .ol-read { display: block; max-height: 560px; overflow-y: auto; }
  .ol-back { display: none; }
}
.ol button:active, .ol-item:active { background: #d7e8f8; }
.ol-folder[aria-pressed="true"]:active { background: #cfe3f7; }
.ol-chip { font: 500 12px var(--sans); padding: 7px 10px; border: 1px solid #d1d1d1; border-radius: 6px; background: #fafafa; color: #242424; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.ol-chip::before { content: "\1F4CE"; margin-right: 6px; }

#p-outlook .ol { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 0; box-shadow: none; height: auto; }
#p-outlook .ol-main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
#p-outlook .ol-list, #p-outlook .ol-read { min-height: 0; height: 100%; overflow-y: auto; max-height: none; }
.mail-new { animation: pop 300ms ease-out; }

/* Phone */
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .rail { order: 2; flex-direction: row; justify-content: space-around; padding: 6px 4px calc(6px + var(--safe-b)); }
  .rb { width: auto; flex: 1; padding: 6px 0; }
  .panel { grid-template-columns: 1fr; order: 1; min-height: 0; }
  .convo { display: none; }
  .open-convo .list { display: none; }
  .open-convo .convo { display: flex; }
  .open-convo .back { display: block; }
  .list { border-right: 0; }
  .msg { max-width: 84%; }
  .chip { font-size: 16px; padding: 13px 14px; }
  .bar, .msgs { font-size: 16px; }
  #toasts { left: 12px; right: 12px; width: auto; top: 10px; }
  #p-outlook .ol-main { display: block; }
  #p-outlook .ol-read { display: none; }
  #p-outlook .ol.reading .ol-read { display: block; }
  #p-outlook .ol.reading .ol-list { display: none; }
  #p-outlook .ol.reading .ol-folders { display: none; }
}
.deck-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.deck-modal[hidden] { display: none; }
.deck-box { background: #fff; color: #242424; border-radius: 8px; width: min(340px, 100%); padding: 20px; font: 400 14px/1.45 var(--sans); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
.deck-box h4 { margin: 0 0 6px; font: 600 16px var(--sans); }
.deck-box p { margin: 0 0 12px; }
.deck-box input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #c8c6c4; border-radius: 4px; font: 400 14px var(--sans); }
.deck-err { color: #a4262c; min-height: 1.2em; margin: 6px 0 0 !important; font-size: 13px !important; }
.deck-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.deck-btns button { padding: 7px 14px; border-radius: 4px; border: 1px solid #c8c6c4; background: #fff; font: 600 13px var(--sans); }
.deck-btns #deckOk { background: #0f6cbd; color: #fff; border-color: #0f6cbd; }
.deck-view { position: fixed; inset: 0; background: #1b1b1b; z-index: 60; display: flex; flex-direction: column; }
.deck-view[hidden] { display: none; }
.deck-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: #fff; font: 600 14px var(--sans); }
.deck-bar .deck-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-bar button { background: #333; color: #fff; border: 0; border-radius: 4px; padding: 6px 12px; font: 600 13px var(--sans); }
.deck-bar button:disabled { opacity: .35; }
.deck-scroll { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 12px 16px; }
.deck-stage { position: relative; width: min(960px, 100%); aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.deck-shape { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; padding: .8cqw 1.2cqw; overflow: hidden; }
.deck-p { line-height: 1.2; overflow-wrap: anywhere; }
.deck-p + .deck-p { margin-top: .6em; }
.deck-count { color: #bbb; font: 500 13px var(--sans); min-width: 56px; text-align: center; }
.deck-nav { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 14px 14px; color: #fff; }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Apps">
    <button class="rb" data-tab="chat" type="button">💬<span>Chat</span><i class="dot" id="chatDot" hidden></i></button>
    <button class="rb" data-tab="teams" type="button">👥<span>Teams</span></button>
    <button class="rb" data-tab="calls" type="button">📞<span>Calls</span></button>
    <button class="rb" data-tab="calendar" type="button">📅<span>Calendar</span></button>
    <button class="rb" data-tab="outlook" type="button">✉️<span>Outlook</span><i class="dot" id="mailDot" hidden></i></button>
  </nav>

  <section class="panel" id="p-chat">
    <aside class="list">
      <header class="lh"><h2>Chat</h2></header>
      <div class="search">Search</div>
      <div id="chatList"></div>
    </aside>
    <main class="convo">
      <header class="ch">
        <button class="back" id="back" type="button" aria-label="Back">‹</button>
        <span class="av sm" id="chAv" style="visibility:hidden"></span>
        <div><b id="chName">Chat</b><small id="status"></small></div>
      </header>
      <div class="placeholder">Select a chat</div>
      <div class="msgs" id="msgs"><div id="threadBoxes"></div></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="bar">Type a message</div>
      </div>
    </main>
  </section>

  <section class="panel" id="p-outlook" hidden>
    <div class="ol" aria-label="Mail">
      <div class="ol-top">
        <span class="ol-logo">Outlook</span>
        <span class="ol-search">Search mail</span>
        <span class="ol-av">SM</span>
      </div>
      <div class="ol-folders" id="ol-folders"></div>
      <div class="ol-main">
        <ul class="ol-list" id="mail-list" aria-label="Messages"></ul>
        <article class="ol-read" id="mail-read" aria-live="polite"></article>
      </div>
    </div>
  </section>

  <section class="panel" id="p-teams" hidden><div id="teamList"></div></section>
  <section class="panel" id="p-calls" hidden><div id="callList"></div></section>
  <section class="panel" id="p-calendar" hidden><div class="empty">Nothing else on today.</div></section>
</div>
<div id="toasts" aria-live="polite"></div>

<div class="deck-modal" id="deckModal" hidden>
  <div class="deck-box" role="dialog" aria-modal="true" aria-labelledby="deckTitle">
    <h4 id="deckTitle">Password required</h4>
    <p id="deckFile"></p>
    <input type="password" id="deckPw" autocomplete="off" aria-label="Password">
    <p class="deck-err" id="deckErr"></p>
    <div class="deck-btns"><button type="button" id="deckCancel">Cancel</button><button type="button" id="deckOk">OK</button></div>
  </div>
</div>
<div class="deck-view" id="deckView" hidden role="dialog" aria-label="Presentation">
  <div class="deck-bar">
    <span class="deck-title" id="deckTitleBar"></span>
    <button type="button" id="deckClose">Close</button>
  </div>
  <div class="deck-scroll"><div class="deck-stage" id="deckStage"></div></div>
  <div class="deck-nav">
    <button type="button" id="deckPrev" aria-label="Previous slide">&#8249; Prev</button>
    <span class="deck-count" id="deckCount"></span>
    <button type="button" id="deckNext" aria-label="Next slide">Next &#8250;</button>
  </div>

  $("#p-chat").classList.remove("no-chat");
  scrollSoon();
}

function openChat() {
  current = "ramona";
  document.querySelectorAll("#threadBoxes .tbox").forEach(function (b) { b.hidden = b.id !== "box-ramona"; });
  setHeader("R", "#c6a2f0", "Ramona", S.ended ? "Offline" : "Available");
  $("#chips").hidden = false;
  showTab("chat");
  $("#p-chat").classList.add("open-convo");
  $("#p-chat").classList.remove("no-chat");
  $("#chatDot").hidden = true;
  S.silent = false;
  if (!S.started) {
    S.started = true;
    run(TREE.root, S.runId);
  } else if (S.pending) {
    var ids = S.pending, my = S.runId;
    S.pending = null;
    setTimeout(function () { if (my === S.runId) showChoices(ids, my); }, 900);
  }
  scrollSoon();
}

function markUnread() {
  if (!(current === "ramona" && !$("#p-chat").hidden)) $("#chatDot").hidden = false;
}
function startStory() {
  if (S.started) return;
  S.started = true;
  S.silent = true;
  run(TREE.root, S.runId);
}
function addMsg(who, text) {
  appendMsg("ramona", who, text);
  markUnread();
  if (who === "them") S.preview = text;
  if (current === "ramona") scrollSoon();
}
function addSys(text) {
  var m = document.createElement("div");
  m.className = "msg sys";
  m.textContent = text;
  box("ramona").appendChild(m);
  markUnread();
  if (current === "ramona") scrollSoon();
}
var typingEl = null;
async function typing(ms, my) {
  if (S.silent) return my === S.runId;
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.innerHTML = "<i></i><i></i><i></i>";
  box("ramona").appendChild(typingEl);
  if (current === "ramona") scrollSoon();
  await sleep(ms);
  if (typingEl) typingEl.remove();
  typingEl = null;
  return my === S.runId;
}
function clearChips() { $("#chips").innerHTML = ""; }
function setStatus(t) { if (current === "ramona") $("#status").textContent = t; }

function showChoices(ids, my) {
  var chips = $("#chips");
  chips.innerHTML = "";
  var label = document.createElement("div");
  label.className = "label";
  label.textContent = "Reply";
  chips.appendChild(label);
  ids.forEach(function (id) {
    var c = document.createElement("button");
    c.className = "chip";
    c.type = "button";
    c.textContent = N[id].text;
    c.onclick = function () { if (my === S.runId) choose(id, my); };
    chips.appendChild(c);
  });
  if (current === "ramona") scrollSoon();
}

async function run(id, my) {
  var n = N[id];
  if (!n || my !== S.runId) return;
  if (n.kind === "end") return finish(n, my);
  if (n.kind === "player") return run(n.children[0], my);

  var ls = lines(n.text);
  for (var i = 0; i < ls.length; i++) {
    var ms = Math.min(1600, 500 + ls[i].length * 35);
    if (!(await typing(ms, my))) return;
    addMsg("them", ls[i]);
  }
  if (!n.children.length) return deadEnd(my);
  // A colleague line that leads straight on (to an ending, say) carries on without asking.
  var kids = n.children.map(function (id) { return N[id]; });
  if (kids.every(function (k) { return k.kind !== "player"; })) {
    if (!S.silent) await sleep(400);
    if (my !== S.runId) return;
    return run(n.children[0], my);
  }
  // While nobody is looking, the reply options wait until the chat is opened.
  if (S.silent) { S.pending = n.children; return; }
  // Pause before the reply options appear.
  await sleep(900);
  if (my !== S.runId) return;
  showChoices(n.children, my);
}

function choose(id, my) {
  clearChips();
  var c = N[id];
  addMsg("me", c.text);
  var next = c.children[0];
  if (!next) return deadEnd(my);
  setTimeout(function () { if (my === S.runId) run(next, my); }, 350);
}

function deadEnd(my) {
  if (my !== S.runId) return;
  clearChips();
  addSys("RAMONA IS OFFLINE.");
  setStatus("Offline");
  S.ended = true;
  endCard();
}

function finish(n, my) {
  var parts = n.text.split("RAMONA IS OFFLINE.");
  var pre = lines(parts[0]);
  var post = (parts[1] || "").trim();
  (async function () {
    for (var i = 0; i < pre.length; i++) {
      var ms = Math.min(1600, 500 + pre[i].length * 35);
      if (!(await typing(ms, my))) return;
      addMsg("them", pre[i]);
    }
    if (my !== S.runId) return;
    clearChips();
    addSys("RAMONA IS OFFLINE.");
    setStatus("Offline");
    S.ended = true;
    if (post) {
      var mail = parseEmail(post);
      setTimeout(function () { if (my === S.runId) receiveEmail(mail); }, 900);
    }
    endCard();
  })();
}

function endCard() {
  var chips = $("#chips");
  chips.innerHTML = "";
  var b = document.createElement("button");
  b.className = "restart";
  b.type = "button";
  b.textContent = "Start again";
  b.onclick = restart;
  chips.appendChild(b);
  if (current === "ramona") scrollSoon();
}

/* Ending text after "RAMONA IS OFFLINE." becomes an email. Lead-in lines such as
   "Email pops into your Outlook saying" or "...that's like:" are dropped. */
function parseEmail(post) {
  var body = post.split("\n")
    .filter(function (l) { return !/(saying|like:)\s*$/i.test(l.trim()); })
    .join("\n")
    .replace(/^\s+|\s+$/g, "")
    .replace(/\n{3,}/g, "\n\n");
  var ls = lines(body);
  var idx = ls.findIndex(function (l) { return /Chief Human Resources Officer/.test(l); });
  var from = idx > 0 ? ls[idx - 1].replace(/,\s*$/, "") : "Rudolfa Dangerton";
  var subjLine = ls.filter(function (l) { return /^Subject:/i.test(l); })[0];
  var subject = subjLine
    ? subjLine.replace(/^Subject:\s*/i, "")
    : (/urgent/i.test(body) ? "Urgent: are you free for a call?" : "Quick catch-up");
  return { from: from, subject: subject, body: ls.filter(function (l) { return !/^Subject:/i.test(l); }) };
}

/* ---------- outlook: the portal's email code, with Ramona's mail added to the same inbox ---------- */
var mailFolder = "inbox";
var mailIx = 0;
function mailItems() { return DATA.mail.folders[mailFolder].items; }

function emailHeader(m) {
  var h = el("div", "hdr");
  var av = el("span", "av", m.initials);
  av.style.background = m.color;
  h.appendChild(av);
  var who = el("div", "");
  who.appendChild(el("div", "who", m.from + " <" + m.addr + ">"));
  var meta = el("div", "meta");
  meta.appendChild(document.createTextNode("To: " + m.to));
  meta.appendChild(document.createElement("br"));
  if (m.cc) {
    meta.appendChild(document.createTextNode("Cc: " + m.cc));
    meta.appendChild(document.createElement("br"));
  }
  meta.appendChild(document.createTextNode((m.draft ? "Status: " : "Sent: ") + m.sent));
  who.appendChild(meta);
  h.appendChild(who);
  return h;
}
function emailBody(m) {
  var frag = document.createDocumentFragment();
  frag.appendChild(emailHeader(m));
  m.body.forEach(function (para) { frag.appendChild(el("p", "", para)); });
  return frag;
}

function renderFolders() {
  var box = document.getElementById("ol-folders");
  box.textContent = "";
  DATA.mail.order.forEach(function (key) {
    var f = DATA.mail.folders[key];
    var b = el("button", "ol-folder");
    b.setAttribute("data-act", "folder");
    b.setAttribute("data-f", key);
    b.setAttribute("aria-pressed", key === mailFolder ? "true" : "false");
    b.appendChild(document.createTextNode(f.label));
    var unread = f.badge != null ? f.badge : f.items.filter(function (m) { return m.unread; }).length;
    if (unread) b.appendChild(el("span", "ct", String(unread)));
    box.appendChild(b);
  });
}

function renderList() {
  var list = document.getElementById("mail-list");
  list.textContent = "";
  var items = mailItems();
  if (!items.length) {
    list.appendChild(el("li", "ol-empty", "Nothing here."));
    return;
  }
  items.forEach(function (m, i) {
    var li = el("li", "");
    var b = el("button", "ol-item" + (m.unread ? " unread" : ""));
    b.setAttribute("data-act", "mail");
    b.setAttribute("data-i", String(i));
    b.setAttribute("aria-selected", i === mailIx ? "true" : "false");
    var av = el("span", "av", m.initials);
    av.style.background = m.color;
    b.appendChild(av);
    var col = el("div", "");
    var r1 = el("div", "row1");
    var outgoing = m.draft || mailFolder === "sent";
    var fromWrap = el("span", "from");
    if (m.unread) fromWrap.appendChild(el("span", "dot", ""));
    fromWrap.appendChild(document.createTextNode(outgoing ? "To: " + m.to.split(" <")[0] : m.from));
    r1.appendChild(fromWrap);
    r1.appendChild(el("span", m.draft ? "date draft-tag" : "date", m.short));
    col.appendChild(r1);
    col.appendChild(el("div", "subj", m.subject));
    col.appendChild(el("div", "prev", m.body[0]));
    b.appendChild(col);
    li.appendChild(b);
    list.appendChild(li);
  });
}

function showFolder(key) {
  mailFolder = key;
  mailIx = 0;
  renderFolders();
  renderList();
  showMail(0);
}

function attachmentBox(names) {
  var att = el("div", "ol-att");
  names.forEach(function (a) {
    var b = el("button", "ol-chip", a);
    b.setAttribute("data-act", "attach");
    att.appendChild(b);
  });
  att.appendChild(el("div", "att-note", ""));
  return att;
}

function showMail(i) {
  var items = mailItems();
  var read = document.getElementById("mail-read");
  read.textContent = "";
  var back = el("button", "ol-back", "\u2039 Inbox");
  back.setAttribute("data-act", "mail-back");
  read.appendChild(back);
  read.scrollTop = 0;
  if (!items.length) {
    mailIx = 0;
    read.appendChild(el("p", "ol-empty", "This folder is empty."));
    return;
  }
  mailIx = Math.max(0, Math.min(items.length - 1, i));
  var m = items[mailIx];
  var rows = document.querySelectorAll(".ol-item");
  for (var k = 0; k < rows.length; k++) {
    rows[k].setAttribute("aria-selected", k === mailIx ? "true" : "false");
  }
  read.appendChild(el("h3", "subject", m.subject));
  read.appendChild(emailBody(m));
  if (m.attachments.length) {
    read.appendChild(attachmentBox(m.attachments));
  }
  if (m.earlier) {
    var prev = DATA.mail.folders[m.earlier.folder].items[m.earlier.index];
    var det = el("details", "earlier");
    det.appendChild(el("summary", "", "Show earlier message from " + prev.from));
    var q = el("div", "quoted");
    q.appendChild(emailBody(prev));
    if (prev.attachments.length) {
      q.appendChild(attachmentBox(prev.attachments));
    }
    det.appendChild(q);
    read.appendChild(det);
  }
}

var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function pad2(n) { return (n < 10 ? "0" : "") + n; }

function receiveEmail(parsed) {
  var d = new Date();
  var hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  var mail = {
    from: parsed.from,
    initials: parsed.from.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase(),
    color: "#2f7d6d",
    addr: parsed.from.toLowerCase().replace(/\s+/g, ".") + "@elucidescence.com",
    to: "Stefan Mueller <stefan.mueller@elucidescence.com>",
    sent: DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + hm + ":" + pad2(d.getSeconds()),
    short: DAYS[d.getDay()].slice(0, 3) + " " + hm,
    subject: parsed.subject,
    unread: true,
    body: parsed.body,
    attachments: [],
    ramona: true
  };
  DATA.mail.folders.inbox.items.unshift(mail);
  $("#mailDot").hidden = false;
  if (!$("#p-outlook").hidden) {
    mailFolder = "inbox";
    mailIx = 0;
    renderFolders();
    renderList();
    showMail(0);
    $(".ol").classList.add("reading");
    var first = document.querySelector(".ol-item");
    if (first) first.classList.add("mail-new");
  } else {
    toast({ title: mail.from, body: mail.subject, onClick: function () { openMailNow(); } });
  }
}

function openMailNow() {
  showTab("outlook");
  mailFolder = "inbox";
  mailIx = 0;
  renderFolders();
  renderList();
  showMail(0);
  $(".ol").classList.add("reading");
}

function onOpenOutlook() {
  $("#mailDot").hidden = true;
  renderFolders();
  renderList();
  $(".ol").classList.remove("reading");
}

/* Click handling for the Outlook pieces (folders, messages, back, attachments). */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  var act = t ? t.getAttribute("data-act") : null;
  if (act === "folder") showFolder(t.getAttribute("data-f"));
  else if (act === "mail") {
    showMail(Number(t.getAttribute("data-i")));
    $(".ol").classList.add("reading");
  }
  else if (act === "mail-back") {
    $(".ol").classList.remove("reading");
  }
  else if (act === "attach") openDeck(t.textContent.trim());
});

function b64bytes(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function unlockDeck(pw) {
  var raw = b64bytes(DECK_B64);
  var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
}
function openDeck(name) {
  $("#deckFile").textContent = name || DECK_NAME;
  $("#deckPw").value = "";
  $("#deckErr").textContent = "";
  $("#deckOk").textContent = "OK";
  $("#deckOk").disabled = false;
  $("#deckModal").hidden = false;
  setTimeout(function () { $("#deckPw").focus(); }, 50);
}
function closeDeck() { $("#deckModal").hidden = true; $("#deckPw").value = ""; closeDeckView(); }
$("#deckCancel").addEventListener("click", closeDeck);
$("#deckModal").addEventListener("click", function (e) { if (e.target === this) closeDeck(); });
$("#deckPw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("#deckOk").click(); });
var DECK = null, deckIx = 0;
function fontFor(f) { return f === "Cambria" ? "Georgia, serif" : "Calibri, Arial, sans-serif"; }
function renderSlide(i) {
  var slides = DECK.slides;
  deckIx = Math.max(0, Math.min(slides.length - 1, i));
  var s = slides[deckIx], stage = $("#deckStage");
  stage.textContent = "";
  stage.style.background = s.bg || "#ffffff";
  s.shapes.forEach(function (sh) {
    var d = document.createElement("div");
    d.className = "deck-shape";
    d.style.left = sh.x + "%"; d.style.top = sh.y + "%";
    d.style.width = sh.w + "%"; d.style.height = sh.h + "%";
    if (sh.fill) d.style.background = sh.fill;
    if (sh.geom === "ellipse") d.style.borderRadius = "50%";
    else if (sh.geom === "round") d.style.borderRadius = "12%";
    d.style.justifyContent = sh.anchor === "ctr" ? "center" : sh.anchor === "b" ? "flex-end" : "flex-start";
    sh.paras.forEach(function (p) {
      var pe = document.createElement("div");
      pe.className = "deck-p";
      if (p.align === "center") pe.style.textAlign = "center";
      else if (p.align === "right") pe.style.textAlign = "right";
      p.runs.forEach(function (r) {
        var sp = document.createElement("span");
        sp.textContent = r.t;
        if (r.size) sp.style.fontSize = (r.size * 100 / 960) + "cqw";
        if (r.bold) sp.style.fontWeight = "700";
        if (r.italic) sp.style.fontStyle = "italic";
        if (r.color) sp.style.color = r.color;
        sp.style.fontFamily = fontFor(r.font);
        pe.appendChild(sp);
      });
      d.appendChild(pe);
    });
    stage.appendChild(d);
  });
  $("#deckCount").textContent = (deckIx + 1) + " / " + slides.length;
  $("#deckPrev").disabled = deckIx === 0;
  $("#deckNext").disabled = deckIx === slides.length - 1;
}
function openDeckView(data) {
  DECK = data;
  $("#deckTitleBar").textContent = "The Question Engine";
  $("#deckModal").hidden = true;
  $("#deckView").hidden = false;
  renderSlide(0);
}
function closeDeckView() { $("#deckView").hidden = true; }
$("#deckClose").addEventListener("click", closeDeckView);
$("#deckPrev").addEventListener("click", function () { if (DECK) renderSlide(deckIx - 1); });
$("#deckNext").addEventListener("click", function () { if (DECK) renderSlide(deckIx + 1); });
document.addEventListener("keydown", function (e) {
  if ($("#deckView").hidden) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { renderSlide(deckIx + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { renderSlide(deckIx - 1); e.preventDefault(); }
  else if (e.key === "Escape") closeDeckView();
});
$("#deckOk").addEventListener("click", async function () {
  var pw = $("#deckPw").value;
  $("#deckErr").textContent = "";
  if (!pw) { $("#deckErr").textContent = "Enter the password."; return; }
  this.disabled = true;
  try {
    var bytes = await unlockDeck(pw);
    openDeckView(JSON.parse(new TextDecoder().decode(bytes)));
    this.disabled = false;
    $("#deckPw").value = "";
  } catch (err) {
    if (err && err.name === "OperationError") {
      $("#deckErr").textContent = "That password isn't right.";
      $("#deckPw").select();
    } else {
      $("#deckErr").textContent = "Something went wrong opening the deck.";
    }
    this.disabled = false;
  }
});

function restart() {
  S = freshState();
  S.started = true;
  DATA.mail = JSON.parse(JSON.stringify(MAILDATA));
  mailFolder = "inbox";
  mailIx = 0;
  $("#mail-read").textContent = "";
  $(".ol").classList.remove("reading");
  closeDeck();
  box("ramona").innerHTML = "";
  clearChips();
  openChat();
  $("#mailDot").hidden = true;
  renderFolders();
  renderList();
  run(TREE.root, S.runId);
}

$("#back").addEventListener("click", function () {
  $("#p-chat").classList.remove("open-convo");
});

renderChatList();
showTab("chat");
$("#p-chat").classList.add("no-chat");

/* Ramona's notification arrives straight away and stays until it is tapped. */
setTimeout(function () {
  startStory();
  toast({ title: "Ramona", body: lines(N[TREE.root].text).join(" "), sticky: true, onClick: openChat });
}, 5000);
</script>
